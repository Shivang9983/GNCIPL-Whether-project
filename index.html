<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather & Clock Dashboard</title>

    <link rel="stylesheet" href="whether.css">

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>

    <div class="container">

        <div class="top-bar">
            <h1>Weather Dashboard</h1>

            <button id="themeBtn">
                <i class="fa-solid fa-moon"></i>
            </button>
        </div>

        

        <div class="clock-section">

            <div id="clock" class="clock">
                00:00:00
            </div>

            <div id="date" class="date">
                Loading...
            </div>

        </div>

        

        <div class="search-section">

            <input
                type="text"
                id="cityInput"
                placeholder="Enter city name">

            <button id="searchBtn">
                Search
            </button>

        </div>

        

        

        <div class="weather-card">

            <h2 id="cityName">
                Loading...
            </h2>

            <img
                id="weatherIcon"
                src=""
                alt="Weather Icon">

            <div id="temp" class="temperature">
                --°C
            </div>

            <div id="condition" class="condition">
                --
            </div>

        </div>

        

        <div class="weather-details">

            <div class="detail-box">
                <h4>Feels Like</h4>
                <p id="feelsLike">--</p>
            </div>

            <div class="detail-box">
                <h4>Humidity</h4>
                <p id="humidity">--</p>
            </div>

            <div class="detail-box">
                <h4>Wind</h4>
                <p id="wind">--</p>
            </div>

            <div class="detail-box">
                <h4>Pressure</h4>
                <p id="pressure">--</p>
            </div>

            <div class="detail-box">
                <h4>Sunrise</h4>
                <p id="sunrise">--</p>
            </div>

            <div class="detail-box">
                <h4>Sunset</h4>
                <p id="sunset">--</p>
            </div>

        </div>

      

        <h2 class="forecast-title">
            5-Day Forecast
        </h2>

        <div id="forecast" class="forecast-container">

        </div>

    </div>

    <script src="whether.js"></script>

</body>
</html>
